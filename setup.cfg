[metadata]
name = fdtdsarsim
version = 1.0
author = Wyatt Gronnemose
author_email = wyatt_gronnemose@sfu.ca

[options]
packages = find:
python_requires >= 3.8
install_requires = 
    numpy >= 1.20
    scipy
    matplotlib
    h5py
    numba
    pyfftw
    tqdm

[options.extras_require]
cuda = pycuda
mpi = mpi4py
